<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Synapse Gradient -->
    <linearGradient id="synapseGrad" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Contour with Subtle Drop Depth -->
  <path d="M32 4 C44 4 54 9 54 20 C54 36 43 49 32 60 C21 49 10 36 10 20 C10 9 20 4 32 4 Z"
        fill="url(#shieldGrad)"
        stroke="#3b82f6"
        stroke-width="1.5" />

  <!-- Inner Security Contour Line -->
  <path d="M32 8 C41 8 49 12 49 21 C49 34 40 45 32 54 C24 45 15 34 15 21 C15 12 23 8 32 8 Z"
        fill="none"
        stroke="#60a5fa"
        stroke-width="1"
        stroke-dasharray="2,2"
        opacity="0.4" />

  <!-- Neural Network Synapse Interconnects (Edges) -->
  <line x1="32" y1="20" x2="20" y2="30" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="20" x2="44" y2="30" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="20" x2="32" y2="36" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="30" x2="32" y2="36" stroke="url(#synapseGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="44" y1="30" x2="32" y2="36" stroke="url(#synapseGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20" y1="30" x2="24" y2="44" stroke="url(#synapseGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="44" y1="30" x2="40" y2="44" stroke="url(#synapseGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="36" x2="24" y2="44" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="36" x2="40" y2="44" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="44" x2="32" y2="50" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="44" x2="32" y2="50" stroke="url(#synapseGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Neural Network Nodes (Vertices) -->
  <!-- Central Primary Anomaly Nexus -->
  <circle cx="32" cy="36" r="4.2" fill="#ffffff" filter="url(#nodeGlow)" />
  <circle cx="32" cy="36" r="2.2" fill="#2563eb" />

  <!-- Top Ingestion Node -->
  <circle cx="32" cy="20" r="3.2" fill="#ffffff" />
  <circle cx="32" cy="20" r="1.6" fill="#3b82f6" />

  <!-- Left Supervised Discriminator Node -->
  <circle cx="20" cy="30" r="3.2" fill="#ffffff" />
  <circle cx="20" cy="30" r="1.6" fill="#60a5fa" />

  <!-- Right Unsupervised Latent Manifold Node -->
  <circle cx="44" cy="30" r="3.2" fill="#ffffff" />
  <circle cx="44" cy="30" r="1.6" fill="#818cf8" />

  <!-- Lower Left Feature Projection Node -->
  <circle cx="24" cy="44" r="3" fill="#ffffff" />
  <circle cx="24" cy="44" r="1.5" fill="#38bdf8" />

  <!-- Lower Right Reconstruction Error Node -->
  <circle cx="40" cy="44" r="3" fill="#ffffff" />
  <circle cx="40" cy="44" r="1.5" fill="#a78bfa" />

  <!-- Bottom Apex Detection Node -->
  <circle cx="32" cy="50" r="3.5" fill="#ffffff" filter="url(#nodeGlow)" />
  <circle cx="32" cy="50" r="1.8" fill="#4f46e5" />
</svg>
