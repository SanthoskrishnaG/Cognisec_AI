# XGBoost Model & Training Configuration
model_name: "xgboost_classifier"
random_seed: 42
save_dir: "artifacts/models"
model_save_path: "artifacts/models/xgboost_model.json"
pipeline_save_path: "artifacts/models/xgboost_pipeline.joblib"

# Model hyperparameters
params:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 1.0
  tree_method: "hist"
  objective: "binary:logistic"
  eval_metric: "logloss"
  n_jobs: -1

# Validation & Early stopping
early_stopping_rounds: 15
optimize_threshold: true
default_threshold: 0.50
target_metric_for_threshold: "f1" # or "recall_at_fpr"
