# Variational Autoencoder (VAE) Architecture & Training Configuration
model_name: "tabular_vae"
random_seed: 42
save_dir: "artifacts/models"
model_save_path: "artifacts/models/vae_checkpoint.pt"
scaler_save_path: "artifacts/models/vae_scaler.joblib"
config_save_path: "artifacts/models/vae_config.json"

# Architecture hyperparameters
architecture:
  latent_dim: 16
  encoder_hidden_dims: [64, 32]
  decoder_hidden_dims: [32, 64]
  activation: "leaky_relu"
  dropout_rate: 0.1
  use_batch_norm: true

# Training hyperparameters
training:
  batch_size: 512
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.00001
  beta_kl: 0.005 # scaling weight for KL divergence
  early_stopping_patience: 6
  device: "cuda" # fallback to cpu if cuda unavailable

# Anomaly thresholding on Benign Validation set
threshold_selection:
  method: "percentile" # select threshold at top (100 - FPR_percentile)% of benign validation scores
  target_fpr_percentiles: [0.5, 1.0, 2.0, 5.0]
  default_target_fpr: 1.0 # default operational operating point: 1% false alarm tolerance
